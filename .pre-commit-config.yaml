repos:
  # ===== PRE-COMMIT HOOKS (fast, every commit) =====

  # Ruff - linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Security - detect secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ===== PRE-PUSH HOOKS (run before push) =====

  # Pre-push gates use the project's own locked tools (.venv / pnpm) so local
  # results match CI. Mirrors with pinned revs drifted from uv.lock before.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/)
        entry: .venv/bin/mypy src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-type-check
        name: pnpm type-check
        entry: pnpm type-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-lint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest-fast
        name: pytest (fast unit tests)
        entry: .venv/bin/pytest tests/unit -x -q -m "not slow" --no-cov -n auto --tb=line
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'

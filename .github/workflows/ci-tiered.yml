name: CI (Tiered Testing)

# PR-only deep validation. Main/develop push CI lives in ci.yml (badge workflow).
on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-tiered-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  determine-tier:
    name: Determine Test Tier
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Determine test tier
        id: tier
        run: |
          TIER="light"
          if [[ "${{ github.head_ref }}" == feature/* ]]; then
            TIER="medium"
          fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'test:heavy') }}" == "true" ]]; then
            TIER="heavy"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'test:medium') }}" == "true" ]]; then
            TIER="medium"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'test:light') }}" == "true" ]]; then
            TIER="light"
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "Test tier: $TIER"

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv tool install ruff
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: mypy src/

  frontend:
    name: Frontend Lint / Types / Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:fast

  unit-tests-fast:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/unit -q -m "not slow" --ignore=tests/unit/pipeline --tb=short

  unit-tests-full:
    name: Unit Tests (Full)
    needs: [determine-tier, lint]
    if: needs.determine-tier.outputs.tier != 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copy_that_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/copy_that_test
      - run: pytest tests/unit -q --cov=src/copy_that --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/copy_that_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    needs: [determine-tier, lint]
    if: needs.determine-tier.outputs.tier != 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copy_that_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/copy_that_test
      - run: pytest tests/integration -q --cov=src/copy_that --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/copy_that_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: false

  frontend-playwright-mvp:
    name: Frontend Playwright MVP
    needs: [determine-tier, frontend]
    if: needs.determine-tier.outputs.tier != 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e:mvp
        env:
          CI: true
          PLAYWRIGHT_USE_MOCKS: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mvp-report
          path: |
            frontend/test-results/
            test-results/
          if-no-files-found: ignore

  security-scan:
    name: Security Scan (Heavy)
    needs: [determine-tier]
    if: needs.determine-tier.outputs.tier == 'heavy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]" pip-audit bandit
      - run: pip-audit --strict --desc on
        continue-on-error: true
      - run: bandit -r src/ -ll || true
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-summary:
    name: Test Summary
    needs: [determine-tier, lint, type-check, unit-tests-fast, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Test Tier: ${{ needs.determine-tier.outputs.tier }}"
            echo ""
            echo "| Test | Status |"
            echo "|------|--------|"
            echo "| Backend Lint | ${{ needs.lint.result }} |"
            echo "| Backend Type Check | ${{ needs.type-check.result }} |"
            echo "| Backend Unit (Fast) | ${{ needs.unit-tests-fast.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

# Single CI workflow (replaces ci.yml + ci-tiered.yml, 2026-10-08).
# Every job installs from the lockfiles (uv.lock / pnpm-lock.yaml) so CI runs the
# same tool versions as `make install` + `make verify` locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (high+ fails the build)
        run: pnpm audit --audit-level high
      - name: Bandit (high severity fails the build)
        run: uvx bandit -r src/ -lll -q
      - name: pip-audit (locked deps)
        run: |
          uv export --frozen --extra dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --desc on \
            $(grep -v '^#' .github/pip-audit-ignore.txt | sed '/^\s*$/d' | awk '{print "--ignore-vuln " $1}')

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --no-install-project
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync mypy src/

  frontend:
    name: Frontend (tsc, eslint, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm --dir frontend lint
      - name: Vitest (full suite)
        run: pnpm test:all

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copy_that_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/copy_that_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync alembic upgrade head
      - name: Unit + integration
        run: >
          uv run --no-sync pytest tests/unit tests/integration -q -n auto
          --cov=src/copy_that --cov-report=xml:coverage.xml
          --junitxml=test-results/pytest.xml
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-results
          path: test-results/
          if-no-files-found: ignore

  e2e:
    name: Playwright MVP (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e:mvp
        env:
          CI: true
          PLAYWRIGHT_USE_MOCKS: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-mvp-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
